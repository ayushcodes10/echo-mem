# Asks first-time contributors to sign the CLA in the pull request thread, and
# records the signature in a `cla-signatures` branch of this repository. A
# contributor is asked once, ever.
#
# Untested against a real third-party pull request: at the time this landed the
# project had exactly one contributor, so there was nobody to test the ask
# against. The first outside PR is the test. If it misbehaves, the failure mode
# is a bot comment on a PR, not a broken build.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or request CLA signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ayushcodes10/echo-mem/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ayushcodes10,bot*,dependabot[bot]
          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/ayushcodes10/echo-mem/blob/main/CLA.md)
            and post the following as a comment on this pull request:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
