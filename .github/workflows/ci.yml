name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          else
            echo "No pyproject.toml yet — skipping install (repo scaffold stage)"
          fi

      - name: Lint (ruff)
        run: |
          if [ -f pyproject.toml ]; then
            ruff check .
          else
            echo "No pyproject.toml yet — skipping lint"
          fi

      - name: Test (pytest, excluding LLM-quality evals)
        run: |
          if [ -f pyproject.toml ]; then
            pytest -m "not eval"
          else
            echo "No pyproject.toml yet — skipping tests"
          fi
