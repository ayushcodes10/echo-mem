name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD`, or the release version.
    validations:
      required: false
  - type: dropdown
    id: build-phase
    attributes:
      label: Which build phase does this relate to?
      options:
        - v1a (core recall)
        - v1b (causal typing / graph traversal)
        - v1.1 (org tenancy)
        - Not sure
    validations:
      required: false
